<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Jour/Nuit</title>
    <style>
        body {
            transition: background 0.3s, color 0.3s;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .toggle {
            display: flex;
            align-items: center;
            width: 120px;
            background: #e0e0e0;
            border-radius: 25px;
            padding: 5px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
        }
        .toggle .circle {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .toggle span {
            flex: 1;
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .dark-mode {
            background: #333;
            color: white;
        }
        .dark-mode .toggle {
            background: #222;
        }
        .dark-mode .toggle .circle {
            transform: translateX(70px);
        }
    </style>
</head>
<body>
    <div class="toggle-container">
        <div class="toggle" onclick="toggleMode()">
            <span>DAYMODE</span>
            <div class="circle">☀️</div>
            <span>NIGHTMODE</span>
        </div>
    </div>
    <script>
        function toggleMode() {
            document.body.classList.toggle('dark-mode');
            let circle = document.querySelector('.circle');
            circle.innerHTML = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
